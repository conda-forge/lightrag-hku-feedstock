# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: lightrag-hku
  version: "1.5.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lightrag_hku-${{ version }}.tar.gz
  sha256: 1c5afb96db5cd9f0b13b7d8d93ce1daf5a51bf7e2f74fe5ce4fe3eb9be03e77f
  patches:
    - requirements.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - accelerate
    - aioboto3
    - configparser
    - google-api-core
    - google-genai
    - graspologic
    - hnswlib
    - json-repair
    - nano-vectordb
    - neo4j-python-driver
    - networkx
    - ollama
    - ollama-python
    - openai
    - oracledb
    - pipmaster
    - pypinyin
    - python-dotenv
    - python-xxhash
    - pytorch
    - pyvis
    - tenacity
    - tiktoken
    - transformers
    - xlsxwriter

tests:
  - python:
      imports:
        - lightrag
      pip_check: true

      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: "LightRAG: Simple and Fast Retrieval-Augmented Generation"
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/HKUDS/LightRAG

extra:
  recipe-maintainers:
    - jan-janssen
